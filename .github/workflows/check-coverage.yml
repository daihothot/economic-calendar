name: Check next-year calendar coverage

on:
  push:
    branches:
      - master
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/check-coverage.yml"
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check next-year data
        run: npm run check:coverage
