name: Build and validate calendars

on:
  push:
    branches:
      - master
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/publish-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate calendars
        run: npm test

      - name: Verify generated feeds are committed
        run: git diff --exit-code -- dist
