name: Build and validate calendars

on:
  push:
    branches:
      - master
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/publish-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate calendars
        run: npm test

      - name: Verify generated feeds are committed
        run: git diff --exit-code -- dist

      - name: Preserve the /dist subscription paths
        run: |
          mkdir -p .pages-site
          cp -R dist .pages-site/dist

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

  deploy-pages:
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the calendars
        id: deployment
        uses: actions/deploy-pages@v4
